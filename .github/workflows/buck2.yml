name: buck2

on:
  pull_request:
    paths:
      - "buck2/**"
      - "buck2-desktop/**"
      - "buck2-android/**"
      - ".github/workflows/buck2.yml"
  push:
    branches: [main]
    paths:
      - "buck2/**"
      - "buck2-desktop/**"
      - "buck2-android/**"
      - ".github/workflows/buck2.yml"
  workflow_dispatch:

jobs:
  buck2-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Buck2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fsSL -o /tmp/buck2.zst \
            https://github.com/facebook/buck2/releases/download/latest/buck2-x86_64-unknown-linux-gnu.zst
          zstd -d /tmp/buck2.zst -o /tmp/buck2
          chmod +x /tmp/buck2
          sudo mv /tmp/buck2 /usr/local/bin/buck2
          buck2 --version

      - name: Build resources discovery
        working-directory: buck2
        run: buck2 build //:app_resources --show-simple-output

      - name: Inspect output
        working-directory: buck2
        run: cat "$(buck2 build //:app_resources --show-simple-output)"

      - name: Verify wire-format parity with Bazel sample
        working-directory: buck2
        # The discover script and the res/ tree are mirrored from
        # ../bazel/; running both scripts with the same module label
        # must produce byte-identical JSON. Guards against drift.
        run: |
          set -euo pipefail
          srcs=$(find app/res -name '*.xml' | LC_ALL=C sort)
          bash _discover.sh /tmp/buck2.json '//samples/x:app' main $srcs
          ( cd ../bazel && bash _discover.sh /tmp/bazel.json '//samples/x:app' main $(find app/res -name '*.xml' | LC_ALL=C sort) )
          diff /tmp/buck2.json /tmp/bazel.json

  # End-to-end: `compose-preview render` detects the Buck2 project, builds the
  # Compose Desktop kotlin_library through the CLI's BXL script and renders its
  # preview on the desktop daemon (compose-ai-tools docs/BUCK.md).
  buck2-desktop-render:
    runs-on: ubuntu-latest
    # A cold run compiles the prelude's Kotlin/Java compiler daemons from source.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The first release with Buck2 Desktop and Android support (compose-ai-tools#6061).
      - uses: yschimke/compose-ai-tools/.github/actions/install@v2.67.0
        with:
          version: 2.67.0
          plugin-readiness-timeout: 0
      # 17 runs the CLI (listed last, so it is JAVA_HOME); 21 is the JDK the
      # prelude's toolchains compile with (.buckconfig.local below).
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Install Buck2
        env:
          BUCK2_RELEASE: "2026-10-15"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fsSL -o /tmp/buck2.zst \
            "https://github.com/facebook/buck2/releases/download/$BUCK2_RELEASE/buck2-x86_64-unknown-linux-gnu.zst"
          zstd -d /tmp/buck2.zst -o /tmp/buck2
          chmod +x /tmp/buck2
          sudo mv /tmp/buck2 /usr/local/bin/buck2
          buck2 --version

      - name: Point Buck2 at JDK 21
        working-directory: buck2-desktop
        run: printf '[java]\n  java_home = %s\n' "$JAVA_HOME_21_X64" > .buckconfig.local

      - name: Build the Compose library
        working-directory: buck2-desktop
        run: buck2 build //app:app --show-output

      - name: List and render the preview through the CLI
        working-directory: buck2-desktop/app
        env:
          CLI: compose-preview
        run: |
          set -euo pipefail
          "$CLI" list --json --timeout 1800 > "$RUNNER_TEMP/list.json"
          python3 - "$RUNNER_TEMP/list.json" <<'PYTHON'
          import json, sys
          text = open(sys.argv[1]).read()
          assert "com.example.buckdesktop.GreetingKt.GreetingPreview" in text, text
          PYTHON
          mkdir -p "$GITHUB_WORKSPACE/build/buck2-render"
          "$CLI" render --filter Greeting --timeout 1800 --verbose \
            --output "$GITHUB_WORKSPACE/build/buck2-render/greeting.png"

      - name: Verify the render
        run: |
          python3 - build/buck2-render/greeting.png <<'PYTHON'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert width > 100 and height > 20, (width, height)
          print(f"greeting.png {width}x{height}")
          PYTHON

      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: buck2-desktop-render
          path: build/buck2-render/
          if-no-files-found: warn

  # The same for a Jetpack Compose android_library: the BXL script links its
  # resource closure into a standalone resource APK and R jar, and the preview
  # renders on the Android (Robolectric) daemon.
  buck2-android-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The first release with Buck2 Desktop and Android support (compose-ai-tools#6061).
      - uses: yschimke/compose-ai-tools/.github/actions/install@v2.67.0
        with:
          version: 2.67.0
          plugin-readiness-timeout: 0
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Install Buck2
        env:
          BUCK2_RELEASE: "2026-10-15"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fsSL -o /tmp/buck2.zst \
            "https://github.com/facebook/buck2/releases/download/$BUCK2_RELEASE/buck2-x86_64-unknown-linux-gnu.zst"
          zstd -d /tmp/buck2.zst -o /tmp/buck2
          chmod +x /tmp/buck2
          sudo mv /tmp/buck2 /usr/local/bin/buck2
          buck2 --version

      # The runner's preinstalled SDK: its newest build tools and numbered platform.
      - name: Point Buck2 at JDK 21 and the Android SDK
        working-directory: buck2-android
        run: |
          set -euo pipefail
          build_tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          platform="$(ls "$ANDROID_HOME/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -1)"
          printf '[java]\n  java_home = %s\n\n[android]\n  sdk_path = %s\n  build_tools_version = %s\n  compile_sdk_version = %s\n' \
            "$JAVA_HOME_21_X64" "$ANDROID_HOME" "$build_tools" "$platform" > .buckconfig.local
          cat .buckconfig.local

      - name: Build the Compose Android library
        working-directory: buck2-android
        run: buck2 build //app:app --show-output

      - name: List and render the preview through the CLI
        working-directory: buck2-android/app
        env:
          CLI: compose-preview
        run: |
          set -euo pipefail
          "$CLI" list --json --timeout 1800 > "$RUNNER_TEMP/list.json"
          python3 - "$RUNNER_TEMP/list.json" <<'PYTHON'
          import sys
          text = open(sys.argv[1]).read()
          assert "com.example.buckandroid.GreetingKt.GreetingPreview" in text, text
          PYTHON
          mkdir -p "$GITHUB_WORKSPACE/build/buck2-android-render"
          "$CLI" render --filter Greeting --timeout 1800 --verbose \
            --output "$GITHUB_WORKSPACE/build/buck2-android-render/greeting.png"

      - name: Verify the render
        run: |
          python3 - build/buck2-android-render/greeting.png <<'PYTHON'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert width > 100 and height > 20, (width, height)
          print(f"greeting.png {width}x{height}")
          PYTHON

      # What the runtime classpath is made of (compose-ai-tools#5945): R-only, empty and
      # shadowed jars, and the overlap between them. Reported as annotations.
      - name: Report the runtime classpath
        if: always()
        run: |
          find buck2-android -path '*/compose-previews/build-artifacts.json' -print0 \
            | while IFS= read -r -d '' doc; do
                python3 .github/scripts/classpath-report.py "$doc" --root "buck2-android" --annotate
              done

      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: buck2-android-render
          path: build/buck2-android-render/
          if-no-files-found: warn
