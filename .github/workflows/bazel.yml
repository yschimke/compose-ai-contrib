name: bazel

on:
  pull_request:
    paths:
      - "bazel/**"
      - "bazel-apk/**"
      - "bazel-desktop/**"
      - "bundle-producer/**"
      - "contract-tests/bazel-cmp-desktop/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew*"
      - ".github/scripts/check-bazel-bundle.py"
      - ".github/scripts/check-android-render.py"
      - ".github/workflows/bazel.yml"
  push:
    branches: [main]
    paths:
      - "bazel/**"
      - "bazel-apk/**"
      - "bazel-desktop/**"
      - "bundle-producer/**"
      - "contract-tests/bazel-cmp-desktop/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew*"
      - ".github/scripts/check-bazel-bundle.py"
      - ".github/scripts/check-android-render.py"
      - ".github/workflows/bazel.yml"
  workflow_dispatch:

jobs:
  bazel-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build resources discovery
        working-directory: bazel
        run: bazel build //:app_resources

      - name: Inspect output
        working-directory: bazel
        run: cat bazel-bin/app_resources.json

  bazel-desktop-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 17.0.20+8
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build the shared bundle-producer jar
        run: ./gradlew :bundle-producer:uberJar --stacktrace

      - name: Stage the producer jar for the Bazel rule
        run: cp bundle-producer/build/libs/bundle-producer-all.jar bazel-desktop/

      - name: Build the Compose Desktop preview bundle
        working-directory: bazel-desktop
        run: bazel build //:preview_bundle //:runtime_classpath

      - name: Verify the bundle contract
        run: python3 .github/scripts/check-bazel-bundle.py bazel-desktop/bazel-bin/preview_bundle.png

      - name: Render the Bazel-built CMP UI through the published daemon
        run: |
          execution_root="$(cd bazel-desktop && bazel info execution_root)"
          ./gradlew :contract-tests:bazel-cmp-desktop:test -PbazelExecutionRoot="$execution_root" --stacktrace

      - name: Upload Bazel desktop bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bazel-desktop-bundle
          path: bazel-desktop/bazel-bin/preview_bundle.png
          if-no-files-found: error

  bazel-build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - uses: android-actions/setup-android@v4
      - name: Install the pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Compose APK
        working-directory: bazel-apk
        run: bazel build //:bazel_sample_apk

  # End-to-end Android proof: `compose-preview render` builds the rules_android
  # Compose library through compose-preview-bazel's Android aspect (selected by
  # `bazel-apk/.compose-preview/bazel.json`), then renders the Greeting preview on
  # the Robolectric daemon against the aspect's linked resources and final R IDs.
  bazel-android-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/checkout@v4.4.0
        with:
          repository: yschimke/compose-ai-tools
          # main at #5965 (Android Bazel targets on the Robolectric daemon). No
          # CLI release carries it yet; move to a release once one does.
          ref: 4ca7f55d67acb307192a7aaa2259ece4e4b4f20d
          path: compose-ai-tools
          persist-credentials: false
      # 17 builds the CLI (listed last, so it is JAVA_HOME); 21 runs it, since
      # Robolectric's newest android-all images need a JDK 21 host.
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: android-actions/setup-android@v4
      - name: Install the pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build the compose-preview CLI
        working-directory: compose-ai-tools
        run: ./gradlew :cli:installDist --stacktrace

      - name: Render the Bazel Android preview through the CLI
        working-directory: bazel-apk
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: >-
          ../compose-ai-tools/cli/build/install/compose-preview/bin/compose-preview
          render --project "$PWD" --filter Greeting
          --output "$GITHUB_WORKSPACE/build/android-render/greeting.png" --verbose

      - name: Verify the render used the linked resources
        run: python3 .github/scripts/check-android-render.py build/android-render/greeting.png

      - name: Upload the Android render
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bazel-android-render
          path: build/android-render/
          if-no-files-found: warn

  upstream-compose-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          repository: bazel-contrib/rules_kotlin
          # v2.4.20: immutable reference to the maintained real Compose APK.
          ref: 02f96a1144527e46724f17381a11cd2cd8b36980
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Build the upstream Jetpack Compose APK
        working-directory: examples/jetpack_compose
        run: |
          bazel test //app:force_build_apks_test
          # A cached build_test does not materialize every dependency artifact,
          # and Android transitions can put the APK outside bazel-bin's config.
          bazel build //app:compose_example_app
          bazel cquery //app:compose_example_app --output=files > apk-outputs.txt
      - name: Verify a dexed APK was produced
        working-directory: examples/jetpack_compose
        run: |
          python3 - <<'PYTHON'
          import zipfile
          from pathlib import Path
          outputs = [Path(line) for line in Path("apk-outputs.txt").read_text().splitlines()]
          apks = [path for path in outputs if path.name == "compose_example_app.apk"]
          assert len(apks) == 1, f"Expected one configured APK, got {apks}"
          with zipfile.ZipFile(apks[0]) as apk:
              assert "AndroidManifest.xml" in apk.namelist()
              assert any(n.startswith("classes") and n.endswith(".dex") for n in apk.namelist())
          PYTHON
