name: bazel

on:
  pull_request:
    paths:
      - "bazel/**"
      - "bazel-apk/**"
      - "bazel-desktop/**"
      - "bundle-producer/**"
      - "contract-tests/bazel-cmp-desktop/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew*"
      - ".github/scripts/check-bazel-bundle.py"
      - ".github/scripts/check-android-render.py"
      - ".github/scripts/annotate-errors.sh"
      - ".github/workflows/bazel.yml"
  push:
    branches: [main]
    paths:
      - "bazel/**"
      - "bazel-apk/**"
      - "bazel-desktop/**"
      - "bundle-producer/**"
      - "contract-tests/bazel-cmp-desktop/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew*"
      - ".github/scripts/check-bazel-bundle.py"
      - ".github/scripts/check-android-render.py"
      - ".github/scripts/annotate-errors.sh"
      - ".github/workflows/bazel.yml"
  workflow_dispatch:

jobs:
  bazel-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build resources discovery
        working-directory: bazel
        run: bazel build //:app_resources

      - name: Inspect output
        working-directory: bazel
        run: cat bazel-bin/app_resources.json

  bazel-desktop-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 17.0.20+101
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build the shared bundle-producer jar
        run: ./gradlew :bundle-producer:uberJar --stacktrace

      - name: Stage the producer jar for the Bazel rule
        run: cp bundle-producer/build/libs/bundle-producer-all.jar bazel-desktop/

      - name: Build the Compose Desktop preview bundle
        working-directory: bazel-desktop
        run: bazel build //:preview_bundle //:runtime_classpath

      - name: Verify the bundle contract
        run: python3 .github/scripts/check-bazel-bundle.py bazel-desktop/bazel-bin/preview_bundle.png

      - name: Render the Bazel-built CMP UI through the published daemon
        run: |
          execution_root="$(cd bazel-desktop && bazel info execution_root)"
          ./gradlew :contract-tests:bazel-cmp-desktop:test -PbazelExecutionRoot="$execution_root" --stacktrace

      - name: Upload Bazel desktop bundle
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bazel-desktop-bundle
          path: bazel-desktop/bazel-bin/preview_bundle.png
          if-no-files-found: error

  bazel-build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - uses: android-actions/setup-android@v4.0.4
      - name: Install the pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Compose APK
        working-directory: bazel-apk
        run: |
          set -o pipefail
          bazel build //:bazel_sample_apk 2>&1 | tee "$RUNNER_TEMP/build.log" \
            || { ../.github/scripts/annotate-errors.sh "$RUNNER_TEMP/build.log"; exit 1; }

  # End-to-end Android proof, with no compose-preview setup in the fixture:
  # `compose-preview render` finds the rules_android Compose library, builds it
  # through compose-preview-bazel's Android aspect (chosen because MODULE.bazel
  # declares rules_compose_preview), then renders the Greeting preview on the
  # Robolectric daemon against the aspect's linked resources and final R IDs.
  bazel-android-render:
    runs-on: ubuntu-latest
    # A cold cache builds rules_android's tools (protobuf included) from source,
    # well past the CLI's 300 s default build timeout; hence `--timeout` below.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.4.0
      # The first release that picks the Bazel Android aspect itself (compose-ai-tools#6063).
      - uses: yschimke/compose-ai-tools/.github/actions/install@v2.68.0
        with:
          version: 2.68.0
          plugin-readiness-timeout: 0
      # Robolectric's newest android-all images need a JDK 21 host.
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: android-actions/setup-android@v4.0.4
      - name: Install the pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Render the Bazel Android preview through the CLI
        working-directory: bazel-apk
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -o pipefail
          compose-preview render --project "$PWD" --filter Greeting --timeout 2400 \
            --output "$GITHUB_WORKSPACE/build/android-render/greeting.png" --verbose \
            2>&1 | tee "$RUNNER_TEMP/render.log" \
            || { ../.github/scripts/annotate-errors.sh "$RUNNER_TEMP/render.log"; exit 1; }

      - name: Verify the render used the linked resources
        run: python3 .github/scripts/check-android-render.py build/android-render/greeting.png

      - name: Upload the Android render
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bazel-android-render
          path: build/android-render/
          if-no-files-found: warn

  # The same for Compose Desktop, with no compose-preview setup in the fixture:
  # `compose-preview list` selects the package's JVM libraries as one module (the
  # CLI installs its JVM aspect under the git-ignored .compose-preview/), and one
  # preview renders on the desktop daemon.
  bazel-desktop-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
      # The first release that picks the Bazel Android aspect itself (compose-ai-tools#6063).
      - uses: yschimke/compose-ai-tools/.github/actions/install@v2.68.0
        with:
          version: 2.68.0
          plugin-readiness-timeout: 0
      # Robolectric's newest android-all images need a JDK 21 host.
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: List and render the Bazel Desktop previews through the CLI
        working-directory: bazel-desktop
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -o pipefail
          {
            compose-preview list --project "$PWD" --json --timeout 1800 > "$RUNNER_TEMP/list.json"
            compose-preview render --project "$PWD" --filter RuntimeGreeting --timeout 1800 \
              --output "$GITHUB_WORKSPACE/build/desktop-render/runtime-greeting.png" --verbose
          } 2>&1 | tee "$RUNNER_TEMP/render.log" \
            || { ../.github/scripts/annotate-errors.sh "$RUNNER_TEMP/render.log"; exit 1; }
          python3 - "$RUNNER_TEMP/list.json" <<'PYTHON'
          import sys
          text = open(sys.argv[1]).read()
          for name in ("GreetingKt.Greeting", "DependencyPreview", "RuntimeGreeting"):
              assert name in text, (name, text)
          PYTHON

      - name: Verify the render
        run: |
          python3 - build/desktop-render/runtime-greeting.png <<'PYTHON'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert width > 100 and height > 20, (width, height)
          print(f"runtime-greeting.png {width}x{height}")
          PYTHON

      - name: Upload the Desktop render
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bazel-desktop-render
          path: build/desktop-render/
          if-no-files-found: warn

  upstream-compose-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          repository: bazel-contrib/rules_kotlin
          # v2.4.20: immutable reference to the maintained real Compose APK.
          ref: 02f96a1144527e46724f17381a11cd2cd8b36980
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Build the upstream Jetpack Compose APK
        working-directory: examples/jetpack_compose
        run: |
          bazel test //app:force_build_apks_test
          # A cached build_test does not materialize every dependency artifact,
          # and Android transitions can put the APK outside bazel-bin's config.
          bazel build //app:compose_example_app
          bazel cquery //app:compose_example_app --output=files > apk-outputs.txt
      - name: Verify a dexed APK was produced
        working-directory: examples/jetpack_compose
        run: |
          python3 - <<'PYTHON'
          import zipfile
          from pathlib import Path
          outputs = [Path(line) for line in Path("apk-outputs.txt").read_text().splitlines()]
          apks = [path for path in outputs if path.name == "compose_example_app.apk"]
          assert len(apks) == 1, f"Expected one configured APK, got {apks}"
          with zipfile.ZipFile(apks[0]) as apk:
              assert "AndroidManifest.xml" in apk.namelist()
              assert any(n.startswith("classes") and n.endswith(".dex") for n in apk.namelist())
          PYTHON
